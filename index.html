<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>udah ya tobat 😭 </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --accent: #ff6b6b;
      --border: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      line-height: 1.6;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 32px;
      letter-spacing: -0.03em;
    }

    .logo span {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .message {
      max-width: 520px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      font-size: 1.15rem;
      font-weight: 500;
    }

    .message p {
      margin-bottom: 12px;
    }

    .message p:last-child {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    .emoji {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span>udah ya tobat</span> 😭 x
  </div>

  <div class="message">
    <p>UDAH WOY UDAH LEBIH BBRP MNT 😹</p>
    <p>takut malah di sebar web nya</p>
  </div>
</body>
</html>
