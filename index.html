<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R videy 😹🇮🇱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --card-hover: #222;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --accent: #ff6b6b;
      --accent2: #4ecdc4;
      --border: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }

    .logo span {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .badge {
      font-size: 0.7rem;
      background: #1e3a2f;
      color: #4ecdc4;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    /* Main */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .video-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: #3a3a3a;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .video-wrapper .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      opacity: 1;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .video-card.playing .play-overlay {
      opacity: 0;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      margin-left: 3px;
      fill: #111;
    }

    .card-body {
      padding: 14px 16px 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tag {
      background: #2a2a2a;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
    }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 960px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #333;
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #2a2a2a;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .close-btn {
      background: #2a2a2a;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #444;
    }

    .modal-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .modal-video video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px 20px 40px;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      max-width: 1200px;
      margin: 0 auto;
    }

    footer a {
      color: var(--accent2);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
      .header-inner {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo">
        <span>R videy</span> 😹🇮🇱
      </a>
      <div class="badge">Free Video Hosting</div>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>R videy 😹🇮🇱</h1>
      <p>Simple & free video hosting • Just click to play</p>
    </div>

    <div class="video-grid" id="videoGrid">
      <!-- Cards will be injected by JS -->
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Video</div>
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <div class="modal-video">
        <video id="modalVideo" controls playsinline></video>
      </div>
    </div>
  </div>

  <footer>
    <p>R videy 😹🇮🇱 • Inspired by simple video hosting</p>
    <p style="margin-top:6px;font-size:0.8rem;">Videos hosted on catbox.moe</p>
  </footer>

  <script>
    const videos = [
      {
        id: 1,
        title: "Video 1",
        src: "https://files.catbox.moe/fid5mb.mp4",
        tag: "MP4"
      },
      {
        id: 2,
        title: "Video 2",
        src: "https://files.catbox.moe/b6tc7x.mp4",
        tag: "MP4"
      },
      {
        id: 3,
        title: "Video 3",
        src: "https://files.catbox.moe/2w6uzr.mp4",
        tag: "MP4"
      },
      {
        id: 4,
        title: "Video 4",
        src: "https://files.catbox.moe/bc03wh.mp4",
        tag: "MP4"
      },
      {
        id: 5,
        title: "Video 5",
        src: "https://files.catbox.moe/8f0fkb.mp4",
        tag: "MP4"
      },
      {
        id: 6,
        title: "Video 6",
        src: "https://files.catbox.moe/j0dyqm.mp4",
        tag: "MP4"
      }
    ];

    const grid = document.getElementById('videoGrid');
    const modal = document.getElementById('playerModal');
    const modalVideo = document.getElementById('modalVideo');
    const modalTitle = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('closeModal');

    // Build cards
    videos.forEach((vid, index) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.dataset.src = vid.src;
      card.dataset.title = vid.title;

      card.innerHTML = `
        <div class="video-wrapper">
          <video muted preload="metadata" playsinline>
            <source src="${vid.src}" type="video/mp4">
          </video>
          <div class="play-overlay">
            <div class="play-btn">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">${vid.title}</div>
          <div class="card-meta">
            <span class="tag">${vid.tag}</span>
            <span>#${String(index + 1).padStart(2, '0')}</span>
          </div>
        </div>
      `;

      // Preview on hover (first frame)
      const videoEl = card.querySelector('video');
      videoEl.addEventListener('loadedmetadata', () => {
        videoEl.currentTime = 0.5;
      });

      card.addEventListener('click', () => openModal(vid));
      grid.appendChild(card);
    });

    function openModal(vid) {
      modalTitle.textContent = vid.title;
      modalVideo.src = vid.src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      modalVideo.play().catch(() => {});
    }

    function closeModal() {
      modal.classList.remove('active');
      modalVideo.pause();
      modalVideo.removeAttribute('src');
      modalVideo.load();
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
